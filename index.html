<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>View Botter</title>
<style>
  :root {
    --bg: #000;
    --surface: #0f0f0f;
    --surface2: #1a1a1a;
    --border: #222;
    --accent: #ff2d55;
    --accent2: #ff6b35;
    --text: #fff;
    --text2: #888;
    --text3: #444;
    --green: #30d158;
    --blue: #0a84ff;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }

  body {
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    display: flex; flex-direction: column;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    padding: 20px 20px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
  }
  .logo-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -.5px; }
  .logo-sub { font-size: 11px; color: var(--text3); letter-spacing: .5px; text-transform: uppercase; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* SCROLL CONTENT */
  .scroll { flex: 1; overflow-y: auto; padding: 16px 16px 100px; display: flex; flex-direction: column; gap: 12px; }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
  }
  .card-label {
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    text-transform: uppercase; color: var(--text3);
    margin-bottom: 10px;
  }

  /* URL INPUT */
  .url-input {
    width: 100%; background: transparent; border: none;
    color: var(--text); font-size: 15px; outline: none;
    font-family: inherit;
  }
  .url-input::placeholder { color: var(--text3); }

  /* VIEWS SLIDER */
  .views-display {
    display: flex; align-items: baseline; gap: 6px; margin-bottom: 14px;
  }
  .views-num {
    font-size: 52px; font-weight: 700; line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .views-label { font-size: 14px; color: var(--text2); }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px;
    background: var(--surface2);
    border-radius: 2px; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 2px 8px rgba(255,45,85,.4);
    cursor: pointer;
  }

  /* QUICK PRESETS */
  .presets { display: flex; gap: 8px; margin-top: 12px; }
  .preset {
    flex: 1; padding: 8px 0; border-radius: 10px;
    background: var(--surface2); border: 0.5px solid var(--border);
    color: var(--text2); font-size: 13px; font-weight: 500;
    cursor: pointer; text-align: center;
    transition: all .15s;
  }
  .preset.active, .preset:active {
    background: rgba(255,45,85,.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* PROXY AREA */
  .proxy-textarea {
    width: 100%; background: transparent; border: none;
    color: var(--text); font-size: 13px; line-height: 1.6;
    outline: none; resize: none; height: 100px;
    font-family: 'SF Mono', 'Courier New', monospace;
  }
  .proxy-textarea::placeholder { color: var(--text3); }
  .proxy-stats {
    display: flex; gap: 16px; margin-top: 10px;
    padding-top: 10px; border-top: 0.5px solid var(--border);
  }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-val { font-size: 18px; font-weight: 600; color: var(--text); }
  .stat-val.green { color: var(--green); }
  .stat-val.red { color: var(--accent); }
  .stat-val.blue { color: var(--blue); }
  .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; }

  /* SETTINGS ROW */
  .settings-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .setting-card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .setting-val {
    width: 100%; background: transparent; border: none;
    color: var(--text); font-size: 24px; font-weight: 600;
    outline: none; font-family: inherit; margin-top: 4px;
  }

  /* PROGRESS */
  .progress-card {
    display: none;
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .progress-card.show { display: block; }
  .progress-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px;
  }
  .progress-title { font-size: 13px; font-weight: 600; }
  .progress-count { font-size: 13px; color: var(--text2); }
  .progress-bar-bg {
    height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width .3s ease;
  }
  .progress-stats {
    display: flex; gap: 16px; margin-top: 12px;
  }
  .prog-stat { font-size: 12px; }
  .prog-stat span { font-weight: 600; }
  .prog-stat .s { color: var(--green); }
  .prog-stat .f { color: var(--accent); }

  /* LOG */
  .log-card {
    display: none;
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    font-size: 13px; line-height: 1.7; color: var(--text2);
  }
  .log-card.show { display: block; }
  .log-card.ok { color: var(--green); border-color: rgba(48,209,88,.2); }
  .log-card.err { color: var(--accent); border-color: rgba(255,45,85,.2); }
  .log-card.run { color: var(--blue); border-color: rgba(10,132,255,.2); }

  /* BOTTOM BAR */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px env(safe-area-inset-bottom, 16px);
    background: rgba(0,0,0,.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--border);
    display: flex; gap: 10px;
  }
  .btn-main {
    flex: 1; padding: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 14px;
    color: #fff; font-size: 17px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 20px rgba(255,45,85,.35);
    transition: all .15s;
    position: relative; overflow: hidden;
  }
  .btn-main:active { transform: scale(.97); opacity: .9; }
  .btn-main:disabled {
    background: var(--surface2); color: var(--text3);
    box-shadow: none;
  }
  .btn-ghost {
    padding: 16px 20px;
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 14px; color: var(--text2);
    font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .btn-ghost:active { opacity: .7; }

  /* RIPPLE */
  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,.3);
    transform: scale(0); animation: ripple .5s ease-out;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🔥</div>
    <div>
      <div class="logo-text">ViewBot</div>
      <div class="logo-sub">TikTok Booster</div>
    </div>
  </div>
  <div class="status-dot" id="dot" title="Server online"></div>
</div>

<div class="scroll">

  <!-- URL -->
  <div class="card">
    <div class="card-label">TikTok URL</div>
    <input class="url-input" id="url" type="url" placeholder="Paste video link here…" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <!-- VIEWS -->
  <div class="card">
    <div class="card-label">Views to send</div>
    <div class="views-display">
      <div class="views-num" id="vn">50</div>
      <div class="views-label">views</div>
    </div>
    <input type="range" id="slider" min="1" max="1000" value="50" step="1">
    <div class="presets">
      <div class="preset" onclick="setViews(10)">10</div>
      <div class="preset" onclick="setViews(50)">50</div>
      <div class="preset active" onclick="setViews(100)">100</div>
      <div class="preset" onclick="setViews(500)">500</div>
      <div class="preset" onclick="setViews(1000)">1K</div>
    </div>
  </div>

  <!-- PROXIES -->
  <div class="card">
    <div class="card-label">Proxies — host:port:user:pass</div>
    <textarea class="proxy-textarea" id="proxies" placeholder="proxy.flameproxies.com:8989:user:pass&#10;proxy.flameproxies.com:8989:user:pass"></textarea>
    <div class="proxy-stats">
      <div class="stat">
        <div class="stat-val blue" id="pc">0</div>
        <div class="stat-label">Loaded</div>
      </div>
      <div class="stat">
        <div class="stat-val red" id="uc">0</div>
        <div class="stat-label">Used</div>
      </div>
      <div class="stat">
        <div class="stat-val green" id="rc">0</div>
        <div class="stat-label">Ready</div>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="settings-row">
    <div class="setting-card">
      <div class="card-label">Watch sec</div>
      <input class="setting-val" id="watch" type="number" value="10" min="3" max="60">
    </div>
    <div class="setting-card">
      <div class="card-label">Concurrency</div>
      <input class="setting-val" id="conc" type="number" value="3" min="1" max="10">
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-card" id="progressCard">
    <div class="progress-header">
      <div class="progress-title">Sending views…</div>
      <div class="progress-count" id="progCount">0 / 0</div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar" id="progBar"></div>
    </div>
    <div class="progress-stats">
      <div class="prog-stat">✓ <span class="s" id="progS">0</span> sent</div>
      <div class="prog-stat">✗ <span class="f" id="progF">0</span> failed</div>
    </div>
  </div>

  <!-- LOG -->
  <div class="log-card" id="log"></div>

</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="btn-ghost" onclick="clearUsed()">Clear</button>
  <button class="btn-main" id="btn" onclick="run(event)">Send Views</button>
</div>

<script>
const SERVER = "https://botter-1.onrender.com";
const KEY = "vb_used";

// slider sync
const slider = document.getElementById("slider");
slider.addEventListener("input", () => {
  document.getElementById("vn").textContent = slider.value;
  document.querySelectorAll(".preset").forEach(p => p.classList.remove("active"));
});

function setViews(n) {
  slider.value = n;
  document.getElementById("vn").textContent = n;
  document.querySelectorAll(".preset").forEach(p => {
    p.classList.toggle("active", parseInt(p.textContent.replace("K","000")) === n || (p.textContent==="1K"&&n===1000));
  });
}

// proxy management
function getUsed(){try{return new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch{return new Set()}}
function saveUsed(s){try{localStorage.setItem(KEY,JSON.stringify([...s]))}catch{}}

function parseProxies(){
  return document.getElementById("proxies").value
    .split("\n").map(l=>l.trim()).filter(l=>l.split(":").length>=4&&l.length>0);
}

function updateMeta(){
  const all=parseProxies(), used=getUsed();
  const rem=all.filter(p=>!used.has(p));
  document.getElementById("pc").textContent=all.length;
  document.getElementById("uc").textContent=used.size;
  document.getElementById("rc").textContent=rem.length;
}

document.getElementById("proxies").addEventListener("input", updateMeta);

function clearUsed(){
  try{localStorage.removeItem(KEY)}catch{}
  updateMeta();
  setLog("Used proxy list cleared.","ok");
}

function setLog(msg, type){
  const el=document.getElementById("log");
  el.className="log-card show "+type;
  el.textContent=msg;
}

function setProgress(done, total, success, fail){
  const card=document.getElementById("progressCard");
  card.classList.toggle("show", total>0);
  const pct = total>0 ? (done/total*100) : 0;
  document.getElementById("progBar").style.width=pct+"%";
  document.getElementById("progCount").textContent=done+" / "+total;
  document.getElementById("progS").textContent=success;
  document.getElementById("progF").textContent=fail;
}

// ripple effect
function addRipple(e, btn) {
  const r = document.createElement("span");
  r.className = "ripple";
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  r.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  btn.appendChild(r);
  setTimeout(()=>r.remove(), 600);
}

// ping server on load
async function pingServer(){
  try{
    const r=await fetch(`${SERVER}/ping`,{signal:AbortSignal.timeout(5000)});
    if(r.ok){ document.getElementById("dot").style.background="var(--green)"; }
    else throw new Error();
  }catch{
    document.getElementById("dot").style.cssText="background:var(--accent);box-shadow:0 0 8px var(--accent)";
  }
}
pingServer();

async function run(e){
  const btn=document.getElementById("btn");
  addRipple(e, btn);

  const url=document.getElementById("url").value.trim();
  const views=parseInt(slider.value);
  const watch=parseFloat(document.getElementById("watch").value);
  const conc=parseInt(document.getElementById("conc").value);

  if(!url){setLog("Paste a TikTok URL first.","err");return;}

  const all=parseProxies();
  const used=getUsed();
  const available=all.filter(p=>!used.has(p));

  if(all.length>0&&available.length===0){
    setLog("All proxies used — add new ones or tap Clear.","err");return;
  }

  const toSend=available.slice(0,views);
  btn.disabled=true; btn.textContent="Running…";
  setProgress(0, views, 0, 0);
  setLog(`Sending ${Math.min(views, toSend.length||views)} views…`,"run");

  try{
    const res=await fetch(`${SERVER}/bot`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url,views,watch_seconds:watch,concurrency:conc,proxies:toSend})
    });
    const data=await res.json();

    const nowUsed=getUsed();
    (data.used_proxies||[]).forEach(p=>nowUsed.add(p));
    saveUsed(nowUsed);
    updateMeta();

    const s=data.success||0, f=data.fail||0;
    setProgress(s+f, s+f, s, f);
    setLog(`✓ Done — ${s} views sent, ${f} failed. ${data.used_proxies?.length||0} proxies consumed.`,"ok");
  }catch(err){
    setLog(`✗ Error — ${err.message}. If first request, wait 60s for server wake-up then retry.`,"err");
    setProgress(0,0,0,0);
  }finally{
    btn.disabled=false; btn.textContent="Send Views";
  }
}

updateMeta();
</script>
</body>
</html>
